[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_analyst"]

[project]
name = "multi-agent-ai-research-analyst"
version = "0.1.0"
description = "LangGraph pipeline that turns a topic into a cited research report (web-search snippets + LLM synthesis)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=1.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "google-genai==2.10.0",
    "redis>=5.0",
    "ddgs==9.14.4",
    "streamlit>=1.35",
    "httpx>=0.28.1",
    "trafilatura>=2.3.1",
    "langfuse>=4.18.0",
    "defusedxml>=0.7.1",
    "pypdf>=7.1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "fakeredis[lua]>=2.20",
    "ruff>=0.5",
    "mypy>=2.4.1",
    "pytest-cov>=7.1.0",
    "langgraph-checkpoint-conformance>=0.0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
norecursedirs = ["manual"]
addopts = "-q --cov --cov-report=term:skip-covered --cov-fail-under=80"

[tool.ruff]
line-length = 120
extend-exclude = ["tests/manual"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP", "S", "ASYNC", "C4", "SIM", "PIE"]
ignore = ["B008", "B905", "B007"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]        # scripts put src/ on sys.path before importing
"app/main.py" = ["E402"]      # env vars / sys.path must be set before project imports
"tests/*" = ["E402", "S101", "S105", "S106", "S603", "S607", "S311", "S104"]   # asserts, dummy keys, subprocess in tests

[tool.mypy]
ignore_missing_imports = true
mypy_path = "src"
explicit_package_bases = true
disallow_untyped_defs = true
warn_unused_ignores = true
files = ["src/research_analyst", "app", "scripts"]

[tool.coverage.run]
core = "sysmon"        # Python 3.12+: the default tracer made first-time pypdf parsing 300x slower under coverage
source = ["src/research_analyst"]
omit = ["*/evaluation/run_eval.py", "*/evaluation/source_quality_check.py"]   # live CLI entry points
